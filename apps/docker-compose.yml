version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smarthome
    volumes:
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: temperature-api
    ports:
      - "8081:8081"
    networks:
      - smarthome-network
    restart: unless-stopped

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8082
      - DEVICE_SERVICE_URL=http://device-service:8083
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

  device-db:
    image: postgres:16-alpine
    container_name: device-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devices
    volumes:
      - ./device-service/init.sql:/docker-entrypoint-initdb.d/init.sql
      - device_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarthome-network

  device-service:
    build:
      context: ./device-service
      dockerfile: Dockerfile
    container_name: device-service
    depends_on:
      device-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:postgres@device-db:5432/devices?sslmode=disable
      - PORT=:8083
    ports:
      - "8083:8083"
    restart: unless-stopped
    networks:
      - smarthome-network

  telemetry-db:
    image: postgres:16-alpine
    container_name: telemetry-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    volumes:
      - ./telemetry-service/init.sql:/docker-entrypoint-initdb.d/init.sql
      - telemetry_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarthome-network

  telemetry-service:
    build:
      context: ./telemetry-service
      dockerfile: Dockerfile
    container_name: telemetry-service
    depends_on:
      telemetry-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@telemetry-db:5432/telemetry
      - PORT=8082
    ports:
      - "8082:8082"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:
  device_data:
  telemetry_data:

networks:
  smarthome-network:
    driver: bridge
